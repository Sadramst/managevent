version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  # Base images of the four production Dockerfiles (ADR-0011).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/marketing
      - /apps/invitation
    schedule:
      interval: monthly
  # postgres and caddy images in the production Compose file.
  - package-ecosystem: docker-compose
    directory: /infra/vps
    schedule:
      interval: monthly
