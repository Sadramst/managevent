name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repository. Nothing here deploys; a green run of
# this workflow on main is what .github/workflows/deploy.yml waits for.
permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: managevent
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d managevent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: local
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/managevent
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/managevent
      PII_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: ci-test-only-better-auth-secret-32chars-minimum
      BETTER_AUTH_URL: http://localhost:4000
      AUTH_COOKIE_DOMAIN: localhost
      GUEST_TOKEN_PEPPER: ci-test-only-guest-token-pepper
      STRIPE_SECRET_KEY: sk_test_ci_mock_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_mock_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4 # reads "packageManager" from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client & deploy migrations
        run: |
          pnpm db:generate
          pnpm db:migrate
      - name: Check Prisma schema drift
        run: pnpm db:drift-check
      - name: Seed database with Perth placeholder content
        run: pnpm db:seed
      - name: Validate /content against content/schemas
        run: pnpm validate:content
      - name: Check i18n dictionaries
        run: pnpm --filter @managevent/i18n test
      - name: Check committed OpenAPI client is up to date
        run: pnpm --filter @managevent/api-client generate:check
      - name: Check formatting
        run: pnpm format:check
      # Builds both web apps (marketing and invitation) along with everything else.
      - name: Run workspace lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build
      - name: Install Chromium
        run: pnpm --filter @managevent/marketing exec playwright install --with-deps chromium
      - name: Marketing browser and accessibility checks
        run: pnpm --filter @managevent/marketing test:e2e

  ops-scripts:
    name: Ops scripts and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and ShellCheck
        run: |
          for script in infra/vps/*.sh; do bash -n "$script"; done
          shellcheck -x infra/vps/*.sh
      - name: Compose files resolve with a complete environment
        working-directory: infra/vps
        run: |
          node ../../scripts/generate-deployment-secrets.mjs --out "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f docker-compose.yml -f docker-compose.build.yml --profile tools config --quiet
      - name: Compose refuses to start without the required secrets
        working-directory: infra/vps
        run: |
          if docker compose --env-file /dev/null -f docker-compose.yml config --quiet 2>/dev/null; then
            echo "docker-compose.yml resolved without any secret: the \${VAR:?} guards are gone" >&2
            exit 1
          fi
      - name: Caddyfile validates
        run: |
          docker run --rm --network none -v "$PWD/infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke` runs inside the built image, in its working directory.
          - app: api
            smoke: node --import tsx -e "import('./src/index.ts').then(()=>process.exit(0),(e)=>{console.error(e);process.exit(1)})"
          - app: worker
            smoke: node --import tsx -e "import('./src/index.ts').then(()=>process.exit(0),(e)=>{console.error(e);process.exit(1)})"
          - app: marketing
            smoke: test -f .next/BUILD_ID
          - app: invitation
            smoke: test -f .next/BUILD_ID
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verifies the Dockerfile only: the image is built and loaded locally, never pushed.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: managevent-${{ matrix.app }}:ci
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,scope=image-${{ matrix.app }},mode=max
      - name: Image runs as a non-root user and its entry point resolves
        env:
          IMAGE: managevent-${{ matrix.app }}:ci
          SMOKE: ${{ matrix.smoke }}
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" = "1000"
          # pnpm must work offline as the runtime user: the migrate, seed and staff tools use it.
          docker run --rm --network none "$IMAGE" pnpm --version
          docker run --rm --network none -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci "$IMAGE" sh -c "$SMOKE"
      # The nearest thing to production that CI can run: the same image, as the same user, with
      # the environment infra/vps/docker-compose.yml gives it (optional providers empty),
      # against a real PostgreSQL. Covers the Prisma engines on Alpine, the `migrate` tool, the
      # start command and the exact healthcheck command of the Compose file.
      - name: API image migrates a database, starts and answers its healthcheck
        if: matrix.app == 'api'
        env:
          IMAGE: managevent-api:ci
        run: |
          set -euo pipefail
          docker network create managevent-ci
          docker run -d --name ci-db --network managevent-ci \
            -e POSTGRES_USER=managevent -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=managevent postgres:16-alpine
          ready=no
          for _ in $(seq 1 30); do
            # Over TCP: the temporary server postgres runs while initialising has no TCP port.
            if docker exec ci-db pg_isready -h 127.0.0.1 -U managevent -d managevent >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 2
          done
          test "$ready" = yes
          url="postgresql://managevent:ci@ci-db:5432/managevent?schema=public"
          secret() { head -c 32 /dev/urandom | od -An -tx1 | tr -d '[:space:]'; }
          {
            echo "DATABASE_URL=$url"
            echo "DIRECT_URL=$url"
            echo "APP_ENV=production"
            echo "NODE_ENV=production"
            echo "PORT=4000"
            echo "TZ=Australia/Perth"
            echo "PII_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64)"
            echo "BETTER_AUTH_SECRET=$(secret)"
            echo "BETTER_AUTH_URL=https://api.managevent.com.au"
            echo "AUTH_COOKIE_DOMAIN=.managevent.com.au"
            echo "AUTH_TRUSTED_ORIGINS="
            echo "GUEST_TOKEN_PEPPER=$(secret)"
            echo "API_PROXY_SECRET=$(secret)"
            echo "TRUSTED_CLIENT_IP_HEADER=x-real-ip"
            echo "NEXT_PUBLIC_MARKETING_URL=https://www.managevent.com.au"
            echo "NEXT_PUBLIC_INVITATION_URL=https://invitation.managevent.com.au"
            echo "NEXT_PUBLIC_ADMIN_URL=https://www.managevent.com.au/admin"
            echo "RESEND_API_KEY="
            echo "STRIPE_SECRET_KEY="
            echo "STRIPE_WEBHOOK_SECRET="
          } > "$RUNNER_TEMP/api.env"
          docker run --rm --init --network managevent-ci --env-file "$RUNNER_TEMP/api.env" -w /app "$IMAGE" \
            pnpm --filter @managevent/db db:migrate
          docker run -d --name ci-api --init --network managevent-ci --env-file "$RUNNER_TEMP/api.env" \
            --security-opt no-new-privileges:true --memory 384m "$IMAGE"
          healthy=no
          for _ in $(seq 1 45); do
            if docker exec ci-api sh -c "wget -qO- http://127.0.0.1:4000/health || exit 1" 2>/dev/null | grep -q '"status":"ok"'; then
              healthy=yes
              break
            fi
            sleep 2
          done
          docker logs --tail 40 ci-api
          test "$healthy" = yes
          # No session: the answer still proves the API reads the database configuration.
          docker exec ci-api wget -qO- http://127.0.0.1:4000/v1/me | grep -q '"user":null'

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
