# Fly.io configuration for apps/api (Sydney region: syd per ADR-0003 and OPEN_DECISIONS D-01)
# DO NOT DEPLOY in Phase 0 without founder sign-off.
app = "managevent-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  NODE_ENV = "production"
  PORT = "4000"
  TZ = "Australia/Perth"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
