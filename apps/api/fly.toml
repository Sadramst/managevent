# Fly.io configuration for apps/api (Sydney region: syd per ADR-0003 and OPEN_DECISIONS D-01)
# Step 2 production scope approved by founder.
app = "managevent-api"
primary_region = "syd"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  release_command = "pnpm db:migrate"

[env]
  APP_ENV = "production"
  NODE_ENV = "production"
  PORT = "4000"
  TZ = "Australia/Perth"
  # Fly's edge sets this header with the address it accepted the connection from. The API
  # takes the client IP from it (never from x-forwarded-for). API_PROXY_SECRET is a secret.
  TRUSTED_CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
