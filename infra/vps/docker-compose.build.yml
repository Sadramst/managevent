# Override that adds `build:` to the four app images, for building on the server itself
# (the manual path, infra/vps/deploy.sh). The base file only references images by tag.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build api
#
# Build ONE service at a time on the 2 GB plan: a Next.js build needs about 1.3 GB of heap.
# The images are tagged `${IMAGE_PREFIX}<service>:${IMAGE_TAG}` exactly as the base file names
# them, so `docker compose up -d` (base file only) then runs what was just built.
services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile

  marketing:
    build:
      context: ../..
      dockerfile: apps/marketing/Dockerfile
      # NEXT_PUBLIC_* values are compiled into the browser bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.managevent.com.au}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-https://www.managevent.com.au}
        NEXT_PUBLIC_INVITATION_URL: ${NEXT_PUBLIC_INVITATION_URL:-https://invitation.managevent.com.au}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://www.managevent.com.au/admin}

  invitation:
    build:
      context: ../..
      dockerfile: apps/invitation/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.managevent.com.au}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-https://www.managevent.com.au}
        NEXT_PUBLIC_INVITATION_URL: ${NEXT_PUBLIC_INVITATION_URL:-https://invitation.managevent.com.au}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://www.managevent.com.au/admin}
