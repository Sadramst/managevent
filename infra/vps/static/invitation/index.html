<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managevent Invitations — Digital Invitations &amp; Guest Management</title>
<meta name="description" content="Digital invitations, RSVP and guest management from Managevent. Launching soon.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0e0f14; --panel:#171923; --ink:#f4f1ea; --muted:#a9a49a; --gold:#c9a86a; --line:rgba(201,168,106,.22); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height:1.6; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card { max-width:560px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:44px 40px; text-align:center; }
  .mark { font-size:2.4rem; margin-bottom:6px; }
  h1 { font-size:1.7rem; font-weight:600; }
  h1 span { color:var(--gold); }
  p { color:var(--muted); margin-top:14px; font-size:1rem; }
  .badge { display:inline-block; margin-top:22px; padding:6px 14px; border:1px solid var(--line); border-radius:999px; color:var(--gold); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
  a { color:var(--gold); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✉️</div>
    <h1>Managevent <span>Invitations</span></h1>
    <p>Digital invitations, RSVP and guest management for every ceremony — weddings, Persian celebrations and more.</p>
    <div class="badge">Launching soon</div>
    <p style="margin-top:22px"><a href="https://www.managevent.com.au">www.managevent.com.au</a> &middot; <a href="mailto:hello@managevent.com.au">hello@managevent.com.au</a></p>
  </div>
</body>
</html>
